name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match Trusted Publisher "Environment" on npmjs.com
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # Do NOT set registry-url here — it writes an empty _authToken into .npmrc
      # and breaks OIDC Trusted Publishing (misleading 404 on PUT).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm prepack

      - name: Publish to npm
        run: |
          # Empty NODE_AUTH_TOKEN short-circuits OIDC → misleading 404
          unset NODE_AUTH_TOKEN
          # Drop auth lines that setup-node may have injected earlier
          if [ -f .npmrc ]; then
            sed -i '/_authToken/d;/always-auth/d' .npmrc
          fi
          # Provenance requires a PUBLIC GitHub repo — this one is private
          npm publish --access public --provenance=false
