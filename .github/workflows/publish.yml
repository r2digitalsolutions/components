name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    # Must match Trusted Publisher "Environment" on npmjs.com
    environment: production
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # Do NOT set registry-url here — it writes an empty _authToken into .npmrc
      # and breaks OIDC Trusted Publishing (misleading 404 on PUT).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.engine-strict=false

      - name: Build package
        run: pnpm prepack

      - name: Publish to npm
        run: |
          # Empty NODE_AUTH_TOKEN short-circuits OIDC → misleading 404
          unset NODE_AUTH_TOKEN
          # Drop auth lines that setup-node may have injected earlier
          if [ -f .npmrc ]; then
            sed -i '/_authToken/d;/always-auth/d' .npmrc
          fi
          # Provenance requires a PUBLIC GitHub repo — this one is private
          npm publish --access public --provenance=false

      - name: Build release notes
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"

          {
            echo "## @r2digisolutions/components \`${TAG#v}\`"
            echo ""
            echo "**npm:** https://www.npmjs.com/package/@r2digisolutions/components/v/${TAG#v}"
            echo ""
            if [ -n "$PREV" ]; then
              echo "### Changes since \`${PREV}\`"
              echo ""
              git log "${PREV}..${TAG}" --pretty=format:'- %s (%h)' --no-merges
              echo ""
              echo ""
              echo "**Full diff:** https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${TAG}"
            else
              echo "### Commits"
              echo ""
              git log "${TAG}" --pretty=format:'- %s (%h)' --no-merges -30
              echo ""
            fi
          } > RELEASE_NOTES.md

          echo "——— Release notes ———"
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
